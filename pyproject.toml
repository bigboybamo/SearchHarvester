[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "searchharvester"
version = "0.1.0"
description = "Job harvester and ATS domain health check for JobSearchBuilder"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Only the harvester talks to SQL Server; the health check runs without an ODBC driver.
db = ["pyodbc>=5.1"]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
